<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Comparison — Low / Mid / High</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --bg:#0b0c10; --surface:#12131a; --surface2:#181924; --border:rgba(255,255,255,.08);
      --text:#e7e8ee; --text2:#9aa0ae; --muted:#6b7180;
      --low:#f59e0b; --mid:#6366f1; --high:#f43f5e;
      --neg:#f472b6; --neu:#fbbf24; --pos:#34d399;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;padding:32px 40px 60px}
    a{color:var(--mid)}
    h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
    .sub{color:var(--text2);font-size:13px;margin-top:6px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:24px}
    .legend-groups{display:flex;gap:14px;font-size:12px;color:var(--text2);align-items:center}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
    .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .kpi{background:var(--surface2);border-radius:10px;padding:10px 12px}
    .kpi .v{font-size:20px;font-weight:800;letter-spacing:-.5px}
    .kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
    .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 8px}
    .chart-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
    .chart-card .cs{font-size:12px;color:var(--text2);margin-bottom:12px}
    .chart-wrap{position:relative;height:280px}
    .full{grid-column:1/-1}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
    th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
    th:first-child,td:first-child{text-align:left}
    thead th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
    .insight{background:var(--surface2);border-left:3px solid var(--mid);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--text2);margin-top:16px;line-height:1.6}
    @media(max-width:900px){.grid,.charts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Group Comparison — Low / Mid / High</h1>
      <div class="sub">현재 실험 완료자 기준 · <a href="./index.html">← 대시보드로</a></div>
    </div>
    <div class="legend-groups">
      <span><span class="dot" style="background:var(--low)"></span>Low</span>
      <span><span class="dot" style="background:var(--mid)"></span>Mid</span>
      <span><span class="dot" style="background:var(--high)"></span>High</span>
    </div>
  </div>

  <div id="kpi-row" class="grid"></div>

  <div class="charts">
    <div class="chart-card"><h3>피드백 양</h3><div class="cs">참가자당 · 에피소드당 평균 피드백 수</div><div class="chart-wrap"><canvas id="c-volume"></canvas></div></div>
    <div class="chart-card"><h3>소요 시간</h3><div class="cs">그룹별 평균 main / tutorial (분)</div><div class="chart-wrap"><canvas id="c-time"></canvas></div></div>
    <div class="chart-card full"><h3>피드백 감정(tone) 분포</h3><div class="cs">부정(1–2) · 중립(3) · 긍정(4–5) 비율</div><div class="chart-wrap" style="height:260px"><canvas id="c-tone"></canvas></div></div>
    <div class="chart-card full"><h3>요약 표</h3><div class="cs">그룹별 핵심 지표</div><div id="table"></div><div id="insight" class="insight"></div></div>
  </div>

  <script>
    const GROUPS=[{key:'low',label:'Low',color:getCSS('--low'),file:'main-low.json'},
                  {key:'mid',label:'Mid',color:getCSS('--mid'),file:'main-mid.json'},
                  {key:'high',label:'High',color:getCSS('--high'),file:'main-high.json'}];
    function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
    const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};
    const r1=x=>Math.round(x*10)/10;
    const tone=s=> s<=2?'neg':(s===3?'neu':'pos');

    async function load(g){
      const res=await fetch('./data/'+g.file,{cache:'no-store'});
      const map=await res.json(); const ppl=Object.values(map);
      let totFb=0,totEp=0; const t={neg:0,neu:0,pos:0}; const mains=[],tuts=[];
      ppl.forEach(p=>{
        const fb=p.feedbackItems||[]; totFb+=fb.length; totEp+=(p.episodes||[]).length;
        fb.forEach(f=>{ if(f.sentiment!=null) t[tone(f.sentiment)]++; });
        const cs=(p.sessions||[]).filter(s=>s.status==='completed');
        const s=cs.sort((a,b)=>(b.mainEndedAt||'').localeCompare(a.mainEndedAt||''))[0]||(p.sessions||[])[0]||{};
        if(s.mainDurationSec) mains.push(s.mainDurationSec/60);
        if(s.tutorialDurationSec) tuts.push(s.tutorialDurationSec/60);
      });
      const tTot=t.neg+t.neu+t.pos||1;
      return {label:g.label,color:g.color, n:ppl.length, totFb, totEp,
        fbPerP: totFb/(ppl.length||1), fbPerEp: totFb/(totEp||1),
        tone:t, negPct:t.neg/tTot*100, neuPct:t.neu/tTot*100, posPct:t.pos/tTot*100,
        mainAvg: mains.reduce((a,b)=>a+b,0)/(mains.length||1), mainMed: median(mains),
        tutAvg: tuts.reduce((a,b)=>a+b,0)/(tuts.length||1)};
    }

    const baseOpts=(yTitle)=>({responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:getCSS('--text2'),font:{size:12}}}},
      scales:{x:{ticks:{color:getCSS('--text2')},grid:{display:false}},
              y:{ticks:{color:getCSS('--text2')},grid:{color:getCSS('--border')},title:{display:!!yTitle,text:yTitle,color:getCSS('--muted')}}}});

    (async()=>{
      const D=await Promise.all(GROUPS.map(load));
      const labels=D.map(d=>d.label), colors=D.map(d=>d.color);

      // KPI cards
      document.getElementById('kpi-row').innerHTML=D.map(d=>`
        <div class="card"><h3><span class="dot" style="background:${d.color}"></span>${d.label} 그룹</h3>
          <div class="kpis">
            <div class="kpi"><div class="v">${d.n}</div><div class="l">완료자</div></div>
            <div class="kpi"><div class="v">${r1(d.fbPerP)}</div><div class="l">피드백/인</div></div>
            <div class="kpi"><div class="v">${r1(d.fbPerEp)}</div><div class="l">피드백/에피</div></div>
            <div class="kpi"><div class="v">${r1(d.mainAvg)}<span style="font-size:12px">분</span></div><div class="l">평균 main</div></div>
            <div class="kpi"><div class="v" style="color:var(--neg)">${Math.round(d.negPct)}%</div><div class="l">부정 비율</div></div>
            <div class="kpi"><div class="v">${d.totFb}</div><div class="l">총 피드백</div></div>
          </div></div>`).join('');

      // Volume chart
      new Chart(document.getElementById('c-volume'),{type:'bar',
        data:{labels,datasets:[
          {label:'참가자당',data:D.map(d=>r1(d.fbPerP)),backgroundColor:colors.map(c=>c+'cc')},
          {label:'에피소드당',data:D.map(d=>r1(d.fbPerEp)),backgroundColor:colors.map(c=>c+'55')}]},
        options:baseOpts('feedback count')});

      // Time chart
      new Chart(document.getElementById('c-time'),{type:'bar',
        data:{labels,datasets:[
          {label:'main (분)',data:D.map(d=>r1(d.mainAvg)),backgroundColor:colors.map(c=>c+'cc')},
          {label:'tutorial (분)',data:D.map(d=>r1(d.tutAvg)),backgroundColor:colors.map(c=>c+'55')}]},
        options:baseOpts('minutes')});

      // Tone stacked (100%)
      const toneOpts=baseOpts('% of feedback'); toneOpts.scales.x.stacked=true; toneOpts.scales.y.stacked=true; toneOpts.scales.y.max=100;
      new Chart(document.getElementById('c-tone'),{type:'bar',
        data:{labels,datasets:[
          {label:'부정 (1–2)',data:D.map(d=>r1(d.negPct)),backgroundColor:getCSS('--neg')},
          {label:'중립 (3)',data:D.map(d=>r1(d.neuPct)),backgroundColor:getCSS('--neu')},
          {label:'긍정 (4–5)',data:D.map(d=>r1(d.posPct)),backgroundColor:getCSS('--pos')}]},
        options:toneOpts});

      // Table
      const row=(name,fn,suf='')=>`<tr><td>${name}</td>${D.map(d=>`<td>${fn(d)}${suf}</td>`).join('')}</tr>`;
      document.getElementById('table').innerHTML=`<table>
        <thead><tr><th>지표</th>${D.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>
        ${row('완료자',d=>d.n)}
        ${row('총 피드백',d=>d.totFb)}
        ${row('피드백/참가자',d=>r1(d.fbPerP))}
        ${row('피드백/에피소드',d=>r1(d.fbPerEp))}
        ${row('부정 %',d=>Math.round(d.negPct),'%')}
        ${row('중립 %',d=>Math.round(d.neuPct),'%')}
        ${row('긍정 %',d=>Math.round(d.posPct),'%')}
        ${row('평균 main(분)',d=>r1(d.mainAvg))}
        ${row('중앙값 main(분)',d=>r1(d.mainMed))}
        ${row('평균 tutorial(분)',d=>r1(d.tutAvg))}
      </tbody></table>`;

      // Auto insight
      const negTrend=D.map(d=>Math.round(d.negPct));
      const volTrend=D.map(d=>r1(d.fbPerP));
      document.getElementById('insight').innerHTML=
        `• 부정 피드백 비율: Low ${negTrend[0]}% → Mid ${negTrend[1]}% → High ${negTrend[2]}%<br>`+
        `• 참가자당 피드백: Low ${volTrend[0]} → Mid ${volTrend[1]} → High ${volTrend[2]}<br>`+
        `• 평균 main 시간(분): Low ${r1(D[0].mainAvg)} · Mid ${r1(D[1].mainAvg)} · High ${r1(D[2].mainAvg)}`;
    })().catch(e=>{document.body.insertAdjacentHTML('beforeend',`<div style="color:#f43f5e;margin-top:20px">로드 실패: ${e.message}</div>`);});
  </script>
</body>
</html>
